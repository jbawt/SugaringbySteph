[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # GA4 measurement ID (public; same as gtag snippet in GA admin)
  VITE_GA_MEASUREMENT_ID = "G-7S7SFLFX8Y"
  # Keep Chromium cache inside the project for Netlify builds
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"
  PUPPETEER_SKIP_DOWNLOAD = "false"
  PUPPETEER_SKIP_CHROME_DOWNLOAD = "false"

# SPA fallback for unknown client routes.
# Prerendered pages live as real files (e.g. /services/index.html) and are
# served first. Static SEO files (robots.txt, sitemap.xml, opengraph.jpg) too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "frame-ancestors 'self' https://websidy.ca https://www.websidy.ca"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/opengraph.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo-2x.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
